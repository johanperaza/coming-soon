<!DOCTYPE html>
<html lang="en-GB">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Johan Peraza Official</title>

    <!-- Noindex for confirmation pages -->
    <meta name="robots" content="noindex, nofollow">

    <!-- Stylesheets & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../variables.css">
    <link rel="stylesheet" href="../master-style.css">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../assets/sunflower.png">

    <style>
        .thanks-body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            background-color: #050505;
            color: #ffffff !important;
            font-family: var(--font-body), 'Inter', sans-serif;
        }

        .thanks-bg-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-image: url('../assets/images/photos/johan-peraza-photoshoot-music-artist-singer-26.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            filter: blur(8px) brightness(0.25);
            transform: scale(1.05);
        }

        .thanks-main-content {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .thanks-card {
            max-width: 460px;
            padding: 50px 40px;
            border-radius: 6px;
            background: rgba(10, 10, 10, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            animation: thanksFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes thanksFadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .thanks-title {
            font-family: var(--font-body), sans-serif !important;
            font-weight: 500 !important;
            font-style: normal !important;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        .thanks-text {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            font-weight: 300;
            margin-bottom: 35px;
        }

        .thanks-btn {
            display: inline-block;
            background: transparent !important;
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            padding: 14px 32px !important;
            font-family: var(--font-body), sans-serif !important;
            font-size: 0.75rem !important;
            text-transform: uppercase !important;
            letter-spacing: 2px !important;
            font-weight: 500 !important;
            text-decoration: none !important;
            border-radius: 0px !important;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
            cursor: pointer;
        }

        .thanks-btn:hover {
            background: #ffffff !important;
            color: #0a0a0a !important;
            border-color: #ffffff !important;
            letter-spacing: 3px !important;
        }

        .thanks-footer {
            position: relative;
            z-index: 2;
            padding: 25px 0;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            background: rgba(10, 10, 10, 0.2);
        }
    </style>
</head>

<body class="thanks-body">

    <div class="thanks-bg-wrapper"></div>

    <main class="thanks-main-content">
        <div class="thanks-card">
            <div style="margin-bottom: 25px;">
                <i class="fa-regular fa-paper-plane"
                    style="font-size: 2.2rem; color: var(--text-primary); opacity: 0.8;"></i>
            </div>

            <h1 class="thanks-title">Message Sent</h1>

            <p class="thanks-text">
                Thank you for reaching out. I have received your inquiry and will get back to you shortly.
            </p>

            <a href="../index.html" class="thanks-btn">
                Back to Home
            </a>
        </div>
    </main>

    <footer class="thanks-footer">
        <p style="font-size: 0.7rem; color: var(--text-muted); opacity: 0.5; letter-spacing: 1px; margin: 0;">
            © 2026 JOHAN PERAZA. ALL RIGHTS RESERVED.
        </p>
    </footer>

</body>

</html>
